codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: nearest
  range: "70...100"
  status:
    project:
      default:
        base: auto
        target: 80%
        threshold: 1%
        if_not_found: success
    patch:
      default:
        base: auto
        target: 80%
        threshold: 1%
        if_not_found: success

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - src/
    carryforward: true
  unit:
    paths:
      - src/__tests__/
    carryforward: true

comment:
  layout: "reach,diff,flags,tree,components"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
  individual_components:
    - component_id: backend
      name: Backend
      paths:
        - backend/**
    - component_id: frontend
      name: Frontend
      paths:
        - src/**
    - component_id: models
      name: Models
      paths:
        - src/models/**
    - component_id: components
      name: React Components
      paths:
        - src/components/**
    - component_id: machines
      name: State Machines
      paths:
        - src/machines/**
    - component_id: utils
      name: Utilities
      paths:
        - src/utils/**
