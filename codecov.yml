codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: nearest
  range: "90...100"
  status:
    project:
      default:
        base: auto
        target: auto
        threshold: 0.05%
        if_not_found: success
    backend:
      target: auto
      threshold: 0.05%
      paths:
        - backend
    frontend:
      target: auto
      threshold: 0.05%
      paths:
        - src

flags:
  unit:
    carryforward: true
    paths:
      - backend
      - src
  cypress:
    carryforward: true
    paths:
      - backend
      - src

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
